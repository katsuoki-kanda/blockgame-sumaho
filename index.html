<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Pose Breakout - Relaxed Mobile</title>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/pose/pose.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
    
    <style>
        body { 
            margin: 0; 
            background: #000; 
            color: #eee; 
            font-family: 'Helvetica Neue', Arial, sans-serif; 
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            position: fixed;
            width: 100%;
        }

        canvas { 
            background: #000; 
            display: block;
        }

        #input_video {
            display: none;
        }

        #ui_container {
            position: absolute;
            top: 10px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 10;
            background: rgba(0, 0, 0, 0.7);
            padding: 5px 12px;
            border-radius: 20px;
            border: 1px solid #00ff88;
            color: #fff;
            font-size: 14px;
            display: flex;
            align-items: center;
            gap: 8px;
            white-space: nowrap;
        }

        #speedSelect {
            background: #222;
            color: #00ff88;
            border: 1px solid #00ff88;
            padding: 2px 5px;
            border-radius: 4px;
            font-size: 14px;
        }
    </style>
</head>
<body>

    <div id="ui_container">
        <label for="speedSelect">速さ:</label>
        <select id="speedSelect">
            <option value="2">2 (とても遅い)</option>
            <option value="3" selected>3 (デフォルト)</option>
            <option value="4">4</option>
            <option value="5">5</option>
            <option value="6">6</option>
        </select>
    </div>

    <video id="input_video" playsinline></video>
    <canvas id="gameCanvas"></canvas>

<script>
/**
 * 1. 基本設定
 */
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
const speedSelect = document.getElementById('speedSelect');

function resizeCanvas() {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
    // ★ 指定の通りパドルの高さを調整
    paddleY = canvas.height - 50; 
}

// ブロック配置設定
const rowCount = 6; // ★ 2段削除 (8段から6段へ)
const columnCount = 15; 
const brickPadding = 4;
const brickOffsetTop = 60; 
let brickWidth = 0; 
const brickHeight = 15; 

let paddleWidth = 140; 
let paddleHeight = 15; 
let paddleY = 0; 
let paddleX = 0;

let ballRadius = 8;
let x, y, dx, dy;

// ★ 速度を現状の約1/2 (7→3) に設定
let baseSpeed = 3; 
let score = 0;
let timeLeft = 90; 
let gameRunning = false;  
let ballLaunched = false; 
let isGameOver = false;   
let cameraReady = false; 
let message = "カメラ起動中..."; 
let bricks = [];
let timerInterval = null;

let baseNoseX = 0.5; 
let currentNoseX = 0.5;
let handWasDown = true; 
let calibrated = false;

/**
 * 2. 音声
 */
const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
function playSound(freq, type = 'sine', decay = 0.1) {
    try {
        if (audioCtx.state === 'suspended') audioCtx.resume();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = type;
        osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
        gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + decay);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + decay);
    } catch(e) {}
}

/**
 * 3. ゲーム管理
 */
function initBricks() {
    bricks = [];
    brickWidth = (canvas.width / columnCount) - brickPadding;
    for(let c=0; c<columnCount; c++) {
        bricks[c] = [];
        for(let r=0; r<rowCount; r++) {
            bricks[c][r] = { x: 0, y: 0, status: 1 };
        }
    }
}

function resetToReady() {
    score = 0;
    timeLeft = 90; 
    gameRunning = false;
    ballLaunched = false;
    isGameOver = false;
    
    baseSpeed = parseInt(speedSelect.value, 10);
    dx = baseSpeed; 
    dy = -baseSpeed;
    
    speedSelect.disabled = false;
    if (cameraReady) message = "手を挙げてスタート！";
    initBricks();
    if (timerInterval) clearInterval(timerInterval);
}

speedSelect.addEventListener('change', (e) => {
    baseSpeed = parseInt(e.target.value, 10);
    if (!ballLaunched) {
        dx = baseSpeed;
        dy = -baseSpeed;
    }
});

/**
 * 4. MediaPipe Pose
 */
const videoElement = document.getElementById('input_video');
const pose = new Pose({
    locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/pose/${file}`
});

pose.setOptions({
    modelComplexity: 0,
    smoothLandmarks: true,
    minDetectionConfidence: 0.5,
    minTrackingConfidence: 0.5
});

pose.onResults(onResults);

const camera = new Camera(videoElement, {
    onFrame: async () => { await pose.send({image: videoElement}); },
    width: 640, height: 480
});
camera.start();

function onResults(results) {
    if (!results.poseLandmarks) return;
    
    const landmarks = results.poseLandmarks;
    const nose = landmarks[0];
    currentNoseX = nose.x; 

    if (!calibrated) {
        baseNoseX = currentNoseX;
        calibrated = true;
        cameraReady = true;
        message = "手を挙げてスタート！";
    }

    const sensitivity = 2.5;
    let diff = (baseNoseX - currentNoseX) * sensitivity;
    let newX = (canvas.width / 2 - paddleWidth / 2) + (diff * canvas.width);
    
    if (newX < 0) newX = 0;
    if (newX > canvas.width - paddleWidth) newX = canvas.width - paddleWidth;
    paddleX = newX;

    const leftWrist = landmarks[15];
    const rightWrist = landmarks[16];
    const isHandRaised = (leftWrist.y < nose.y) || (rightWrist.y < nose.y);

    if (isGameOver) {
        if (isHandRaised && handWasDown) {
            resetToReady();
            handWasDown = false;
        }
    } else if (!gameRunning || !ballLaunched) {
        if (isHandRaised && handWasDown) {
            startGame();
            handWasDown = false;
        }
    }
    if (!isHandRaised) handWasDown = true;
}

function startGame() {
    gameRunning = true;
    ballLaunched = true;
    message = "";
    playSound(1000, 'sine', 0.3);
    //speedSelect.disabled = true;

    if (timerInterval) clearInterval(timerInterval);
    timerInterval = setInterval(() => {
        if (gameRunning && ballLaunched) {
            timeLeft--;
            if (timeLeft <= 0) endGame("TIME UP!");
        }
    }, 1000);
}

function endGame(msg) {
    gameRunning = false;
    ballLaunched = false;
    isGameOver = true;
    clearInterval(timerInterval);
    message = msg + "\n(手を挙げてリセット)";
    playSound(200, 'triangle', 0.5);
    speedSelect.disabled = false;
}

/**
 * 5. 描画・物理
 */
function draw() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    drawHUD(); 
    drawBricks();
    drawPaddle();
    drawBall();
    drawMessages();

    if (gameRunning && ballLaunched) {
        updatePhysics();
    } else if (!isGameOver) {
        x = paddleX + paddleWidth / 2;
        y = paddleY - ballRadius - 2;
    }

    requestAnimationFrame(draw);
}

function drawHUD() {
    ctx.font = "bold 18px Arial";
    ctx.fillStyle = "#00ff88";
    ctx.textAlign = "left";
    ctx.fillText(`SCORE: ${score}`, 20, 30);
    ctx.textAlign = "right";
    ctx.fillText(`TIME: ${timeLeft}`, canvas.width - 20, 30);
}

function drawPaddle() {
    ctx.fillStyle = "#00ff00";
    ctx.beginPath();
    ctx.roundRect(paddleX, paddleY, paddleWidth, paddleHeight, 5);
    ctx.fill();
    ctx.strokeStyle = "#fff";
    ctx.lineWidth = 1;
    ctx.stroke();
}

function drawBall() {
    if (isGameOver && !ballLaunched) return;
    ctx.beginPath();
    ctx.arc(x, y, ballRadius, 0, Math.PI*2);
    ctx.fillStyle = "#fff";
    ctx.shadowBlur = 10;
    ctx.shadowColor = "#00ff88";
    ctx.fill();
    ctx.shadowBlur = 0;
    ctx.closePath();
}

function drawBricks() {
    for(let c=0; c<columnCount; c++) {
        for(let r=0; r<rowCount; r++) {
            if(bricks[c] && bricks[c][r] && bricks[c][r].status === 1) {
                let bx = (c * (brickWidth + brickPadding)) + (brickPadding/2);
                let by = (r * (brickHeight + brickPadding)) + brickOffsetTop;
                bricks[c][r].x = bx;
                bricks[c][r].y = by;
                ctx.fillStyle = `hsl(${r * 25 + 190}, 70%, 50%)`;
                ctx.fillRect(bx, by, brickWidth, brickHeight);
            }
        }
    }
}

function drawMessages() {
    if (message !== "") {
        ctx.font = "bold 24px sans-serif";
        ctx.fillStyle = "#00ff88";
        ctx.textAlign = "center";
        const lines = message.split('\n');
        lines.forEach((line, i) => {
            ctx.fillText(line, canvas.width / 2, canvas.height / 2 + (i * 35));
        });
    }
}

function updatePhysics() {
    if(x + dx > canvas.width - ballRadius || x + dx < ballRadius) {
        dx = -dx;
        playSound(800, 'sine', 0.1);  
    }
    if(y + dy < ballRadius) {
        dy = -dy;
        playSound(800, 'sine', 0.1);
    }

    if(y + dy > paddleY && y + dy < paddleY + paddleHeight) {
        if(x > paddleX && x < paddleX + paddleWidth) {
            dy = -Math.abs(dy);
            let deltaX = x - (paddleX + paddleWidth / 2);
            dx = deltaX * 0.12; 
            playSound(800, 'sine', 0.1);
        }
    }

    if(y > canvas.height) {
        ballLaunched = false;
        score = Math.max(0, score - 50); 
        message = "手を挙げて再発射！";
        playSound(150, 'sawtooth', 0.3);
    }

    for(let c=0; c<columnCount; c++) {
        for(let r=0; r<rowCount; r++) {
            let b = bricks[c][r];
            if(b && b.status === 1) {
                if(x > b.x && x < b.x + brickWidth && y > b.y && y < b.y + brickHeight) {
                    dy = -dy;
                    b.status = 0;
                    score += 10;
                    playSound(1000, 'sine', 0.1);
                    if(score >= rowCount * columnCount * 10) endGame("CLEAR!");
                }
            }
        }
    }
    x += dx;
    y += dy;
}

window.addEventListener('resize', () => {
    resizeCanvas();
    initBricks();
});

resizeCanvas();
initBricks();
resetToReady();
draw();

</script>
</body>
</html>
